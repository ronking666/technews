name: 每日科技资讯推送

on:
  schedule:
    # 保留原有凌晨触发兜底；外部定时服务在北京时间 06:40/06:50 启动
    - cron: '27 4 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-tech-news
  cancel-in-progress: false

jobs:
  push-news:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 检查当天发送记录
        id: delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m technews.delivery_guard news

      - name: 安装依赖
        if: steps.delivery.outputs.should_send == 'true'
        run: python -m pip install -r requirements.txt

      - name: 运行科技资讯推送
        id: send
        if: steps.delivery.outputs.should_send == 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: 保存发送记录
        if: success() && steps.send.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.delivery.outputs.receipt_name }}
          path: delivery-receipts/sent.json
          if-no-files-found: error
          retention-days: 7
