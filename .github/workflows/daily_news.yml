name: 每日科技资讯推送

on:
  # 定时任务
  schedule:
    # 这里的 cron 表达式使用 UTC 时间。
    # 北京时间早上 8:00 对应 UTC 时间的 0:00。
    - cron: '0 0 * * *'
  
  # 允许在 GitHub Actions 页面手动点击运行，方便调试
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行推送脚本
      env:
        # 将配置好的 Secret 传入环境变量供 Python 读取
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      run: |
        python main.py
