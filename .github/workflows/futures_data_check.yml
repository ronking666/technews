name: Futures live data check

on:
  pull_request:
    paths:
      - 'futures.py'
      - 'technews/quotes.py'
      - 'requirements.txt'
      - '.github/workflows/futures_data_check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: 获取实际行情，只预览、不发送微信
        run: python futures.py --preview
