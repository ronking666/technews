name: 每日财经行情推送

on:
  schedule:
    # 每天北京时间早上 6 点运行 (对应 UTC 晚上 21:31 点)
    - cron: '23 31 * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  run-finance-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        # 这里多装了一个 yfinance 库用来获取行情
        pip install requests yfinance

    - name: 运行财经推送脚本
      env:
        # 直接复用之前配好的 Server酱 密钥
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      run: |
        python finance.py
