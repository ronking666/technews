name: 每日财经行情推送

on:
  schedule:
    # UTC 22:15 = 北京时间次日 06:15
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-finance-report
  cancel-in-progress: false

jobs:
  push-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行财经行情推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python finance.py
